<!doctype html>
<!-- Код мови підставляє `src/hooks.server.ts` під час пререндеру, окремо для
     кожної з 42 мовних версій. Прибитий тут код означав би, що весь сайт
     оголошує себе українським — саме так і було до 2026-08-15.

     НЕ згадуй тут плейсхолдер дослівно: заміна бере ПЕРШЕ входження в
     документі, тож слово в коментарі перехопить підстановку, а справжній
     атрибут лишиться з плейсхолдером. Один раз так уже сталося. -->
<html lang="%lang%">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<meta name="theme-color" content="#242424" />
	<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
	<script>
		(function () {
			try {
				const PREFIX = 'digitalworkshop_';
				// Список, а не будь-який рядок: у сховищі може лежати сміття,
				// записане з ?theme= до того, як параметр почали перевіряти.
				// Тоді на першому кадрі ставився неіснуючий data-theme, під який
				// немає жодного правила — сторінка малювалася без теми взагалі.
				const THEMES = ['dark', 'light', 'colorful'];
				const saved = localStorage.getItem(PREFIX + 'theme');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				const theme = THEMES.indexOf(saved) !== -1 ? saved : (prefersDark ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme', theme);
				const meta = document.querySelector('meta[name="color-scheme"]');
				if (meta) meta.setAttribute('content', theme === 'dark' ? 'dark' : 'light dark');
			} catch (e) { }
		})();
	</script>
	%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
