# DEPENDENCIES-v8 § 3 (DEP-DEPENDABOT, HIGH).
#
# Кожна залежність цього проєкту — чужий код, який виконується в браузері
# відвідувача. Без цього файлу оновлення не відстежував ніхто: `npm audit` у CI
# каже, що вразливість уже є, а Dependabot каже, що вона вже виправлена вище за
# течією. Перше — сигнал тривоги, друге — робота, яку можна зробити заздалегідь.
#
# Патчі й мінори — одним PR на тиждень, мажори — окремими. Причина в
# діагностиці: коли пачка оновлень щось ламає, у групі з мінорів винуватця
# видно за хвилини, а мажор поруч із ними перетворює розбір на бінарний пошук.
# Svelte, SvelteKit і Vite розведено ще й між собою — їхні мажори прийнято
# ставити поодинці (§ 3.2).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Мажори цих трьох приходять окремими PR і ставляться поодинці.
      - dependency-name: svelte
        update-types: [version-update:semver-major]
      - dependency-name: '@sveltejs/kit'
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]

  # Версії самих actions теж застарівають, і застарілий `actions/checkout`
  # виявляється не помилкою, а попередженням у логу, якого ніхто не читає.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
