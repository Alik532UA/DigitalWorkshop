name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` — і це не оптимізація, а умова того, що гейти
# взагалі виконуються (CI-CD-AND-TOOLS-v8 § 1.3, AI-AGENT-PITFALLS-v8 § 1.4).
# При `true` пуш пачкою комітів скасовує всі проміжні прогони й лишає останній:
# прогін, який УПЕРШЕ виконав би доданий крок, не завершується ніколи. Саме так
# у Slovko новий гейт кілька днів вважався робочим, не виконавшись жодного разу.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Lint
        run: npm run lint

      # Без `-- --run`: скрипт уже `vitest run`, і прапорець тут лише вдавав би,
      # що конфіг може бути watch-режимом. Компенсація в yaml нічого не лікує —
      # локальний прогін і будь-який інший викликач її не бачать
      # (CI-CD-AND-TOOLS-v8 § 1.4). Те, що скрипт не watch, тримає src/ci.test.ts.
      - name: Run unit tests
        run: npm run test:unit

      # Поріг high, а не moderate: після оновлення лишилися лише 3 low, але
      # moderate-поріг довелося б вимкнути на першому ж транзитивному
      # попередженні, а вимкнений гейт гірший за відсутній.
      #
      # Свідоме відхилення від GATE-AUDIT: канон каже `--omit=dev`, тут dev
      # лишається в перевірці. Ці 3 low сидять саме в dev-гілці, гейт із ними
      # зелений, і звужувати обсяг означало б перестати бачити те, що зараз
      # видно. Якщо колись доведеться вимикати — спершу `--omit=dev`, і лише
      # тоді послаблення стане відходом, а не порогом.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      # Єдиний гейт, що читає build/, а не src/. Обидва дефекти, через які він
      # написаний — прибитий `<html lang>` на всіх 42 мовах і CSP, що не
      # покривала власний інлайн-скрипт, — у джерелах виглядали правильно.
      - name: Check build output
        run: npm run check:build

      # Єдина машинна перевірка правила «артефакт збірки не комітиться»
      # (CI-CD-AND-TOOLS-v8 § 1.5, VERSIONING-v8 § 1.4). Падає, якщо збірка
      # змінила відстежуваний файл — типово це app-version.json із buildTime.
      - name: Build must not touch tracked files
        run: git diff --exit-code

      - name: Lighthouse Audit
        run: npx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the `pages` option in your adapter-static config
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
