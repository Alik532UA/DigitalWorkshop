name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` — і це не оптимізація, а умова того, що гейти
# взагалі виконуються (CI-CD-AND-TOOLS-v8 § 1.3, AI-AGENT-PITFALLS-v8 § 1.4).
# При `true` пуш пачкою комітів скасовує всі проміжні прогони й лишає останній:
# прогін, який УПЕРШЕ виконав би доданий крок, не завершується ніколи. Саме так
# у Slovko новий гейт кілька днів вважався робочим, не виконавшись жодного разу.
concurrency:
  group: pages
  cancel-in-progress: false

# Тут стояв `env: FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true`, і він не робив
# нічого, окрім шкоди. Заміряно 2026-09-10 читанням `runs.using` в `action.yml`
# кожного мажора: усі шість дій цього файлу — `node24`, а composite
# `upload-pages-artifact@v5` усередині пінить `upload-artifact@v7`. Тобто
# форсувати не було чого; натомість прапорець ховав би попередження, якби мажор
# колись опустили (`upload-artifact@v5`, наприклад, досі на `node20`).
# Перелік перевірених мажорів із датами тримає `src/ci.test.ts`
# (CI-CD-AND-TOOLS-v9 § 1.9, `CI-ACTION-RUNTIME`).

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # Без `-- --run`: скрипт уже `vitest run`, і прапорець тут лише вдавав би,
      # що конфіг може бути watch-режимом. Компенсація в yaml нічого не лікує —
      # локальний прогін і будь-який інший викликач її не бачать
      # (CI-CD-AND-TOOLS-v8 § 1.4). Те, що скрипт не watch, тримає src/ci.test.ts.
      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: npm run test:unit

      # Поріг high, а не moderate: після оновлення лишилися лише 3 low, але
      # moderate-поріг довелося б вимкнути на першому ж транзитивному
      # попередженні, а вимкнений гейт гірший за відсутній.
      #
      # Свідоме відхилення від GATE-AUDIT: канон каже `--omit=dev`, тут dev
      # лишається в перевірці. Ці 3 low сидять саме в dev-гілці, гейт із ними
      # зелений, і звужувати обсяг означало б перестати бачити те, що зараз
      # видно. Якщо колись доведеться вимикати — спершу `--omit=dev`, і лише
      # тоді послаблення стане відходом, а не порогом.
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

      # Кеш браузерів між прогонами: `npm ci` їх не приносить, а
      # `playwright install` без кешу качає ~130 МБ щоразу.
      - name: Cache Playwright browsers
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      # axe над ЗІБРАНИМ сайтом (ACCESSIBILITY-v8 § 10, GATE-A11Y-AXE). До
      # 2026-08-23 цього гейта в проєкті не було зовсім — не «зелений», а
      # відсутній. Конфіг Playwright сам робить `npm run build` і піднімає
      # прев'ю, тож окремого кроку збірки тут не потрібно.
      - name: E2E — axe над зібраним сайтом
        if: ${{ !cancelled() }}
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build
        id: build
        run: npm run build

      # Єдиний гейт, що читає build/, а не src/. Обидва дефекти, через які він
      # написаний — прибитий `<html lang>` на всіх 42 мовах і CSP, що не
      # покривала власний інлайн-скрипт, — у джерелах виглядали правильно.
      - name: Check build output
        run: npm run check:build

      # Бюджет бандла міряє КРИТИЧНИЙ ШЛЯХ сторінки, а не суму `entry/`: при
      # route-based code splitting там 2.9 КБ, і такий гейт зелений завжди
      # (PERFORMANCE-v9 § 10.1). Окремим кроком, а не всередині `check:build`:
      # два різні вердикти мусять бути видні окремо, інакше перший червоний
      # ховає другий.
      #
      # Умова складена, і друга її половина обов'язкова. Голий `!cancelled()`
      # запускає крок і тоді, коли `Build` УПАВ або був пропущений, — а
      # `build/` на раннері вже лежить від власної збірки Playwright. Гейт
      # міряв би артефакт, якого щойно не вдалося зробити, і звітував би про
      # нього «витримано». Тому запуск прив'язаний до наслідку самого кроку
      # збірки, а не до стану job: масковання немає, вердикту про чужу збірку
      # теж (`src/ci.test.ts`).
      - name: Bundle budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:bundle

      # Єдина машинна перевірка правила «артефакт збірки не комітиться»
      # (CI-CD-AND-TOOLS-v8 § 1.5, VERSIONING-v8 § 1.4). Падає, якщо збірка
      # змінила відстежуваний файл — типово це app-version.json із buildTime.
      - name: Build must not touch tracked files
        run: git diff --exit-code

      - name: Lighthouse Audit
        run: npx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          # this should match the `pages` option in your adapter-static config
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
